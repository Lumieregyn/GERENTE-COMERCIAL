<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerente Comercial IA - QR Code</title>
</head>
<body>
  <h1>Escaneie o QR com o WhatsApp</h1>
  <img id="qr" src="/qr" alt="QR Code" />
  <script>
    // atualiza a cada 30s
    setInterval(() => {
      document.getElementById('qr').src = '/qr?'+Date.now();
    }, 30000);
  </script>
</body>
</html>
